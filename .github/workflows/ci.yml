name: CI

# Module 1: governance triggers.
# - push to main: validates direct merges (should be blocked by protection;
#   this run proves the gate works if it ever fires).
# - pull_request to main: the PR gate branch protection requires.
# - merge_group: merge-queue batch validation (Time-of-Check vs Time-of-Use fix).
# - workflow_dispatch: manual incident re-run without a code push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Module 1, Step 1 + 4: least-privilege credential hygiene.
# Top-level read-only; no job gets write access unless it explicitly needs it
# (e.g. a future flake-bot job opening issues would get issues: write).
# This is the OIDC-safe default: no long-lived secrets, no broad tokens.
permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  fast:
    name: fast (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Module 2, enterprise gap fix: cache-hit observability.
      # setup-python hides hit/miss; without this line you cannot prove the
      # 3–5 min setup saving or diagnose a poisoned cache at scale.
      - name: Report pip cache status
        run: echo "pip cache-hit=${{ steps.setup.outputs.cache-hit }} (py ${{ matrix.python-version }})"

      - name: Install package
        run: pip install -e .[dev]

      - name: Validate quarantine manifest
        run: |
          python - <<'EOF'
          import json
          import subprocess
          with open('tests/quarantine.json', encoding='utf-8') as f:
              entries = json.load(f).get('quarantined', [])
          ids = [entry if isinstance(entry, str) else entry['id'] for entry in entries]
          collected = subprocess.run(
              ['python', '-m', 'pytest', '--collect-only', '-q'],
              check=True,
              text=True,
              stdout=subprocess.PIPE,
          ).stdout.splitlines()
          collected = {line.strip() for line in collected if '::' in line}
          missing = [node_id for node_id in ids if node_id not in collected]
          if missing:
              raise SystemExit(f'quarantine entries match no collected tests: {missing}')
          print(f'quarantine manifest valid: {len(ids)} entries')
          EOF

      - name: Run fast unit tests
        run: |
          # Module 3, Step 2: stable tiers exclude quarantined tests.
          # Manifest is data (tests/quarantine.json); empty list = zero
          # extra args = today's behavior unchanged.
          python -c "import json; [print(entry if isinstance(entry, str) else entry['id']) for entry in json.load(open('tests/quarantine.json')).get('quarantined', [])]" > /tmp/quarantine.txt
          DESELECT=()
          while IFS= read -r line; do
            [ -n "$line" ] && DESELECT+=(--deselect "$line")
          done < /tmp/quarantine.txt
          python -m pytest
            tests/test_cli.py
            tests/test_valuation.py
            tests/test_sentiment.py
            tests/test_bias_guard.py
            tests/test_memory.py
            tests/test_memory_mcp.py
            tests/test_news_cli.py
            tests/test_newsfeed.py
            tests/test_watchlist.py
            tests/test_wrapup.py
            tests/test_pdf2md.py
            tests/test_risk_guardrails.py
            tests/test_quarantine_manifest.py
            -q --junitxml=junit-fast.xml --durations=20 "${DESELECT[@]}"

      - name: Upload fast results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-fast-py${{ matrix.python-version }}
          path: junit-fast.xml
          retention-days: 7

  slow:
    name: slow / network-shaped (py 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: fast
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        run: |
          # merge_group (merge-queue batches) must ALWAYS run the slow tier:
          # batch validation is the Time-of-Check vs Time-of-Use fix from
          # Module 1 — a skipped tier here would let ci-gate pass unvalidated.
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -Eq '^(src/|tests/|pyproject.toml|.github/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        id: setup
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Report pip cache status
        if: steps.changes.outputs.run == 'true'
        run: echo "pip cache-hit=${{ steps.setup.outputs.cache-hit }} (py 3.12, slow tier)"

      - name: Install package
        if: steps.changes.outputs.run == 'true'
        run: pip install -e .[dev]

      # All tests here are mocked/offline by design (see AGENTS.md),
      # but they exercise the heavy quant / market / broker paths,
      # so they run as the second tier behind fast unit tests.
      # Module 3, Step 2: same quarantine deselect as the fast tier.
      # Manifest validity is enforced by the fast tier's blocking check.
      - name: Run slow tests
        if: steps.changes.outputs.run == 'true'
        run: |
          python -c "import json; [print(entry if isinstance(entry, str) else entry['id']) for entry in json.load(open('tests/quarantine.json')).get('quarantined', [])]" > /tmp/quarantine.txt
          DESELECT=()
          while IFS= read -r line; do
            [ -n "$line" ] && DESELECT+=(--deselect "$line")
          done < /tmp/quarantine.txt
          python -m pytest
            tests/test_market.py
            tests/test_fred.py
            tests/test_stock_data.py
            tests/test_advanced.py
            tests/test_advanced_quant.py
            tests/test_paper_trading.py
            -q --junitxml=junit-slow.xml --durations=20 "${DESELECT[@]}"

      - name: Upload slow results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-slow
          path: junit-slow.xml
          if-no-files-found: ignore
          retention-days: 7

  flake-report:
    name: flake-report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [fast, slow]
    if: always()
    permissions:
      contents: read
    steps:
      # Module 3, Step 4: pattern junit-* also picks up junit-quarantine.xml,
      # so quarantined results flow into the summary with zero extra wiring.
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          merge-multiple: true

      - name: Summarize slowest tests
        run: |
          python - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for f in sorted(glob.glob('junit-*.xml')):
              try:
                  root = ET.parse(f).getroot()
              except Exception as e:
                  print(f'{f}: unparsable ({e})')
                  continue
              cases = root.iter('testcase')
              rows = [(c.get('classname', ''), c.get('name', ''), float(c.get('time', 0) or 0)) for c in cases]
              rows.sort(key=lambda r: r[2], reverse=True)
              print(f'== {f}: {len(rows)} tests ==')
              for cls, name, t in rows[:10]:
                  print(f'  {t:7.2f}s {cls}::{name}')
          EOF

  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: fast
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t finance:ci .

      - name: Smoke test CLI
        run: docker run --rm finance:ci --help

  # Module 3, Step 3: non-blocking quarantine tier (informational signal).
  # Runs ONLY manifest-listed tests. continue-on-error + ci-gate exclusion
  # convert "red = blocked fleet" into "red = fix this test".
  # Empty manifest = green no-op (today's state: zero known flakes).
  quarantine:
    name: quarantine (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: fast
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        id: setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Report pip cache status
        run: echo "pip cache-hit=${{ steps.setup.outputs.cache-hit }} (py 3.12, quarantine tier)"

      - name: Install package
        run: pip install -e .[dev]

      - name: Run quarantined tests
        run: |
          python -c "import json; [print(entry if isinstance(entry, str) else entry['id']) for entry in json.load(open('tests/quarantine.json')).get('quarantined', [])]" > /tmp/quarantine.txt
          QUARANTINED=()
          while IFS= read -r line; do
            [ -n "$line" ] && QUARANTINED+=("$line")
          done < /tmp/quarantine.txt
          if [ "${#QUARANTINED[@]}" = "0" ]; then
            echo "No quarantined tests — green no-op."
            exit 0
          fi
          python -m pytest "${QUARANTINED[@]}" \
            -q --junitxml=junit-quarantine.xml --durations=20

      - name: Upload quarantine results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-quarantine
          path: junit-quarantine.xml
          if-no-files-found: ignore
          retention-days: 7

  # Module 1, Step 1: single stable required status check.
  # Why: matrix jobs produce dynamic names ("fast (py 3.12)", "fast (py 3.13)")
  # that are painful to pin in branch protection + merge queue rules.
  # Require THIS job ("CI gate / ci-gate") in branch protection instead.
  # It stays red if any upstream job fails, skipped, or is cancelled.
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [fast, slow, docker, flake-report, quarantine]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check upstream results
        run: |
          echo "fast=${{ needs.fast.result }} slow=${{ needs.slow.result }} docker=${{ needs.docker.result }} flake=${{ needs.flake-report.result }} quarantine=${{ needs.quarantine.result }}(informational)"
          for r in "${{ needs.fast.result }}" "${{ needs.slow.result }}" "${{ needs.docker.result }}" "${{ needs.flake-report.result }}"; do
            # slow may be skipped when no relevant files changed (success/skip allowed);
            # quarantine is informational by design (continue-on-error) and never blocks;
            # anything failed or cancelled blocks the gate.
            case "$r" in
              success|skipped) ;;
              *) echo "CI gate blocked by upstream result: $r"; exit 1 ;;
            esac
          done
          echo "CI gate passed."
